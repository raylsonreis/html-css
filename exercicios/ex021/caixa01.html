<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>

h1{

    background-color: antiquewhite;
    height: 38px;
    width: 380px;


    border: 10px solid aquamarine;

    padding: 20px;

    margin: 20px auto 20px auto;


    outline: 5px dashed cadetblue;

}

a{

    border-width: 5px;
    border-style: solid;
    border-color: rgb(233, 76, 76);

    padding-top: 5px;
    padding-right: 10px;
    padding-bottom: 10px;
    padding-left: 10px;

    margin-top: 5px;
    margin-right: 5px;
    margin-bottom: 5px;
    margin-left: 5px;



}

    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline level.</a> Vamos ver como tudo isso funciona.</p>

</body>
</html>
