<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>imagens dinamicas</h1>
    <p>Tente abrir esse site em dispositivos diferentes</p>


    <picture>
        <source media="(max-width: 750px)" srcset="imagens/p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/m.png" type="image/png">
           <img src="imagens/g.png" alt="imagem flexivel">
    </picture>
<h1>Reproduzindo áudio</h1>
<p>Reproduzindo áudios em HTML5</p>
<audio preload="auto" autoplay controls>
   <source src="midia/cry-for-you.mp3" type="audio/mpeg">
   <source src="midia/cry-for-you.ogg" type="audio/ogg">
</audio>
<p><a href="midia/cry-for-you.mp3">Clique aqui</a> para baixar o áudio</p>
</body>
</html>
