<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <style>

        body{

            font-family: Arial, Helvetica, sans-serif;

        }

        a{

            color: aquamarine;
            text-decoration: none;
            font-weight: bold;

        }

        a:visited{

            color: cadetblue;

        }

        a:hover{

            color: black;
            text-decoration: underline;

        }

        a:active{

            color: limegreen;

        }

        a::after{

            content: '[link]';
        }


    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank">Repositório Github</a></li>
        <li><a href="https://www.youtube.com/cursoemvideo" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do Cursoemvideo</a></li>


    </ul>
    
</body>
</html>
